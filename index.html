<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>十浩下單</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="十浩下單">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffffff">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<style>
  html,body{margin:0;height:100%;background:#fff;}
  iframe{position:fixed;inset:0;width:100%;height:100%;border:0;padding-top:env(safe-area-inset-top);box-sizing:border-box;background:#fff;}
  #msg{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font:16px -apple-system,sans-serif;color:#888;}
</style>
</head>
<body>
<div id="msg">十浩下單 載入中…</div>
<iframe id="f" allow="clipboard-write" onload="document.getElementById('msg').style.display='none'"></iframe>
<script>
  // 網址後面的 ?c=客戶代碼 會一起帶給下單網站（批發客專屬連結）
  var m = location.search.match(/[?&]c=([A-Za-z0-9_-]+)/);
  document.getElementById('f').src = 'https://script.google.com/macros/s/AKfycby-Ju1DJELS3W9VICyIgvSNcQFd_gAqsETZwGoZQcmFq74d-6RuNwjqekYDT-Toql_9Wg/exec' + (m ? '?c=' + m[1] : '');
</script>
</body>
</html>
