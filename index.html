<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>十浩下單</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="十浩下單">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffffff">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<style>
  html,body{margin:0;height:100%;background:#fff;}
  iframe{position:fixed;inset:0;width:100%;height:100%;border:0;padding-top:env(safe-area-inset-top);box-sizing:border-box;background:#fff;}
  #msg{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font:16px -apple-system,sans-serif;color:#888;}
</style>
</head>
<body>
<div id="msg">十浩下單 載入中…</div>
<iframe id="f" allow="clipboard-write" onload="document.getElementById('msg').style.display='none'"></iframe>
<script>
  // 網址後面的 ?shop=客戶代碼 會一起帶給下單網站（批發客專屬連結）
  var m = location.search.match(/[?&]shop=([A-Za-z0-9_-]+)/);
  // 批發客專屬連結：不顯示十浩名稱與 Logo（主畫面圖示、分頁標題）
  if (m) {
    document.title = '專屬訂購';
    document.getElementById('msg').textContent = '載入中…';
    var saved = [].slice.call(document.querySelectorAll('link[rel="apple-touch-icon"],link[rel="icon"]'));
    saved.forEach(function (x) { x.remove(); });
    var t = document.querySelector('meta[name="apple-mobile-web-app-title"]'); if (t) t.content = '專屬訂購';
    // 下單網站回報這個連結要顯示十浩品牌時，把 Logo 圖示和名稱放回來
    window.addEventListener('message', function (e) {
      if (!e.data || e.data.oaBrand !== true) return;
      document.title = '十浩下單';
      if (t) t.content = '十浩下單';
      saved.forEach(function (x) { document.head.appendChild(x); });
      setManifest('十浩下單', true);
    });
  }
  // 加到主畫面時保留客戶代碼
  var base = location.origin + location.pathname;
  var ml = null;
  function setManifest(nm, withIcons) {
    var man = {name: nm, short_name: nm, start_url: base + (m ? '?shop=' + m[1] : ''), display:'standalone',
      background_color:'#ffffff', theme_color:'#ffffff',
      icons: withIcons ? [{src: base.replace(/[^/]*$/, '') + 'icon-192.png', sizes:'192x192', type:'image/png'},
             {src: base.replace(/[^/]*$/, '') + 'icon-512.png', sizes:'512x512', type:'image/png'}] : []};
    if (ml) ml.remove();
    ml = document.createElement('link'); ml.rel = 'manifest';
    ml.href = 'data:application/manifest+json,' + encodeURIComponent(JSON.stringify(man));
    document.head.appendChild(ml);
  }
  setManifest(m ? '專屬訂購' : '十浩下單', !m);
  document.getElementById('f').src = 'https://script.google.com/macros/s/AKfycby-Ju1DJELS3W9VICyIgvSNcQFd_gAqsETZwGoZQcmFq74d-6RuNwjqekYDT-Toql_9Wg/exec' + (m ? '?shop=' + m[1] : '');
</script>
</body>
</html>
