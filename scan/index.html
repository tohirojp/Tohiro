<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>掃條碼</title>
<meta name="robots" content="noindex">
<style>
  :root{--pri:#1f5fd6;--bad:#c62828;--sub:#6b7385;--line:#e3e6ee;--chip:#eef2fb}
  *{box-sizing:border-box}
  html,body{margin:0;background:#111;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif;-webkit-text-size-adjust:100%}
  .wrap{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 16px)}
  .head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  .head h1{font-size:19px;margin:0}
  .btn{display:block;border:0;border-radius:12px;padding:13px 14px;font-size:16px;font-weight:700;background:var(--pri);color:#fff;text-align:center;text-decoration:none;cursor:pointer;font-family:inherit}
  .btn.ghost{background:#2a2f3a;color:#fff}
  .btn.sm{padding:9px 12px;font-size:15px}
  .box{position:relative;background:#000;border-radius:14px;overflow:hidden;aspect-ratio:3/4;max-height:62vh;width:100%}
  .box video{width:100%;height:100%;object-fit:cover;display:block}
  .aim{position:absolute;left:7%;right:7%;top:38%;height:24%;border:3px solid rgba(255,255,255,.9);border-radius:10px;box-shadow:0 0 0 999px rgba(0,0,0,.3)}
  .msg{min-height:22px;margin:10px 0;font-size:15px;color:#cfd3dc;line-height:1.5}
  .msg.bad{color:#ff8a80;font-weight:700}
  .row{display:flex;gap:8px;margin-top:8px}
  .row>*{flex:1}
  .manual{display:flex;gap:8px;margin-top:10px}
  .manual input{flex:1;min-width:0;padding:12px;border-radius:12px;border:1px solid #444;background:#1c1f26;color:#fff;font-size:16px}
  .note{font-size:13px;color:#8b93a5;margin-top:12px;line-height:1.6}
  .hidden{display:none!important}
  .box.small{aspect-ratio:auto;height:26vh}
  .res{background:#fff;color:#1b1f2a;border-radius:14px;padding:14px;margin-top:10px}
  .res .top{display:flex;gap:12px;align-items:flex-start}
  .res img{width:84px;height:84px;object-fit:cover;border-radius:10px;background:#eee;flex:none}
  .res .nm{font-size:17px;font-weight:800;line-height:1.35}
  .res .sub{font-size:13px;color:var(--sub);margin-top:3px}
  .nums{display:flex;gap:8px;margin:12px 0}
  .nums div{flex:1;background:#f3f5fa;border-radius:10px;padding:8px 4px;text-align:center;font-size:13px;color:var(--sub)}
  .nums b{display:block;font-size:24px;color:#1b1f2a}
  .nums .rem b{color:var(--pri)} .nums .done b{color:#2e7d32}
  .res .row .btn.ghost{background:#e9edf5;color:#1b1f2a}
  .res .bad{color:var(--bad);font-weight:800;font-size:16px}
  .pick{display:block;width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px;margin-top:8px;font-size:15px;font-family:inherit;color:#1b1f2a}
  .pick small{display:block;color:var(--sub);margin-top:2px}
  .tip{font-size:12px;color:var(--sub);margin-top:8px}
  #file{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}
</style>
</head>
<body>
<div class="wrap">
  <div class="head"><h1>📷 掃條碼</h1><a class="btn ghost sm" id="back" href="#">✕ 返回</a></div>
  <div class="box" id="box"><video id="v" playsinline muted></video><div class="aim"></div></div>
  <div class="msg" id="msg">開啟相機中…</div>
  <div class="res hidden" id="res"></div>
  <div class="row"><label class="btn ghost" for="file">📸 拍照辨識</label><button class="btn ghost" id="retry">↻ 重新掃描</button></div>
  <input type="file" id="file" accept="image/*" capture="environment">
  <div class="manual"><input id="code" inputmode="numeric" placeholder="手動輸入條碼或商品コード"><button class="btn" id="go">查詢</button></div>
  <div class="note" id="note">相機會一直開著，掃到就直接顯示訂購／已買／剩餘，<b>不會自動採買</b>。掃到後按「📤 送到採買頁」，再切回原本的採買分頁確認採買。<br>第一次使用請允許相機。</div>
  <div class="note" id="stat"></div>
</div>
<script>
(function(){
  // 只跟十浩的 Google Apps Script 網站溝通（避免被拿去連到別的網站）
  var q = new URLSearchParams(location.search), ret = q.get('ret') || '';
  if (!/^https:\/\/script\.google\.com\/(a\/[^\/]+\/)?macros\/s\/[A-Za-z0-9_-]+\/(exec|dev)$/.test(ret)) ret = '';
  // 掃碼工作階段ID：原採買頁按 📷 時由伺服器產生（隨機 32 碼、綁帳號、10 分鐘沒用就失效）。
  // 這頁沒有登入權限，只能用這個ID「查商品」和「送出掃碼結果」；不能採買、不能改數量。
  var sid = q.get('sid') || '';
  if (!/^[a-f0-9]{32}$/.test(sid)) { sid = ''; try { sid = sessionStorage.getItem('shihao_scan_sid') || ''; } catch (e) {} if (!/^[a-f0-9]{32}$/.test(sid)) sid = ''; }
  try { if (sid) sessionStorage.setItem('shihao_scan_sid', sid); localStorage.removeItem('shihao_scan_tk'); } catch (e) {}   // 舊版存的登入憑證一併清掉
  try { history.replaceState(null, '', location.pathname + '?ret=' + encodeURIComponent(ret)); } catch (e) {}   // ID 不留在網址列
  var $ = function(id){ return document.getElementById(id); };
  function msg(t, bad){ var m=$('msg'); m.textContent=t; m.className='msg'+(bad?' bad':''); }
  function tryClose(after){   // 這個分頁是採買頁用程式開的，通常可以自己關掉；關不掉就留著顯示提示
    try { window.close(); } catch (e) {}
    setTimeout(function(){ if (after) after(); }, 600);
  }
  var SENT = { seq:0, name:'', timer:null };
  function sendToBuyPage(p, code){   // 送出掃碼結果給原採買頁（經伺服器一次性交接）
    if (!sid) return expired();
    msg(''); showRes('<div class="nm">送出中…</div><div class="sub">'+esc(p.name)+'</div>');
    api({ api:'submit', sid:sid, key:p.key, code:code }, function(r){
      if (!r || !r.ok) {
        if (r && /SCAN_SESSION/.test(r.error||'')) return expired();
        showOne(p, code); stat('送出失敗（' + ((r && r.error) || '網路') + '），請再按一次。', true); return;
      }
      SENT.seq = r.seq; SENT.name = p.name; stop();
      showSent(false);
      watchReceived();
      tryClose(function(){ showSent(false); });
    }, 15000);
  }
  function showSent(received){
    D.shown = null;
    showRes('<div class="nm">' + (received ? '✓ 採買頁已收到並定位' : '✓ 已送出') + '</div>'
      + '<div class="sub">' + esc(SENT.name) + '</div>'
      + '<div class="sub" style="margin-top:8px">請切回原本的<b>採買分頁</b>（Safari 右下角的分頁按鈕），會自動停在這個商品。確認數量後按「確認採買」。</div>'
      + '<div class="row"><button class="btn ghost" data-a="cont">↻ 繼續掃描下一件</button></div>');
  }
  function watchReceived(){   // 顯示採買頁有沒有收到（方便判斷卡在哪一步）
    if (SENT.timer) clearInterval(SENT.timer);
    var n = 0, seq = SENT.seq;
    SENT.timer = setInterval(function(){
      if (++n > 120 || seq !== SENT.seq) { clearInterval(SENT.timer); return; }
      if (document.hidden) return;
      api({ api:'status', sid:sid }, function(r){
        if (r && r.ok && r.received >= seq && seq === SENT.seq) { clearInterval(SENT.timer); stat('✓ 採買頁已收到並定位（' + SENT.name + '）'); if (!$('res').classList.contains('hidden') && !D.shown) showSent(true); }
      }, 8000);
    }, 3000);
  }
  function expired(){
    D.shown = null; D.list = null; msg('');
    stat('掃碼工作階段已失效。', true);
    showRes('<div class="bad">掃碼工作階段已失效</div><div class="sub">可能超過 10 分鐘沒使用，或採買頁已登出。請關掉這個分頁，回採買頁重新按 📷。</div>'
      + '<div class="row"><button class="btn" data-a="close">關閉這個分頁</button></div>');
  }
  // ---- 跟採購網站（Google Apps Script）溝通：先用 fetch，不行再用 JSONP ----
  var NJ = 0;
  function api(params, done, ms){
    var finished = false; function end(r){ if (finished) return; finished = true; done(r || { ok:false, error:'NETWORK' }); }
    var qs = Object.keys(params).map(function(k){ return k + '=' + encodeURIComponent(params[k]); }).join('&');
    var t = setTimeout(function(){ end({ ok:false, error:'TIMEOUT' }); }, ms || 25000);
    function jsonp(){
      var name = '__scanCb' + (++NJ) + '_' + Date.now(), sc = document.createElement('script');
      window[name] = function(r){ clearTimeout(t); cleanup(); end(r); };
      function cleanup(){ try { delete window[name]; } catch (e) { window[name] = undefined; } if (sc.parentNode) sc.parentNode.removeChild(sc); }
      sc.onerror = function(){ clearTimeout(t); cleanup(); end({ ok:false, error:'NETWORK' }); };
      sc.src = ret + '?' + qs + '&callback=' + name + '&_=' + Date.now();
      document.head.appendChild(sc);
    }
    if (!window.fetch) return jsonp();
    fetch(ret + '?' + qs + '&_=' + Date.now(), { credentials:'omit', redirect:'follow', cache:'no-store' })
      .then(function(res){ return res.text(); })
      .then(function(txt){ var r; try { r = JSON.parse(txt); } catch (e) { r = null; } if (r && typeof r.ok === 'boolean') { clearTimeout(t); end(r); } else jsonp(); })
      .catch(function(){ if (!finished) jsonp(); });
  }
  function stat(t, bad){ var e=$('stat'); if(e){ e.textContent=t; e.style.color = bad ? '#ff8a80' : ''; } }
  $('back').onclick = function(e){ e.preventDefault(); stop(); tryClose(function(){ msg('請切回原本的採買分頁（Safari 右下角的分頁按鈕）。'); }); };
  $('go').onclick = function(){ var c=$('code').value.replace(/\s/g,''); if(!c){ msg('請輸入條碼',true); return; } $('code').blur(); S.done=false; found(c); };
  $('code').addEventListener('keydown', function(e){ if(e.key==='Enter') $('go').click(); });
  $('retry').onclick = function(){ hideRes(); start(); };

  // ---- 商品資料（從採購網站只讀取得，用來在這頁直接顯示數量）----
  var D = { list:null, at:0, loading:false, n:0, shown:null };
  function esc(t){ return String(t==null?'':t).replace(/[&<>"']/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function fmt(n){ n=Number(n)||0; return String(Math.round(n*100)/100); }
  function loadData(done){
    if (!ret || !sid || D.loading) { if(done) done(); return; }
    D.loading = true;
    api({ api:'products', sid:sid }, function(r){
      D.loading = false;
      if (r && r.ok && r.products) { D.list = r.products; D.at = Date.now(); stat('✓ 已連線採買頁' + (r.user ? '（' + r.user + '）' : '') + '｜商品資料 ' + r.products.length + ' 項'); }
      else if (r && /SCAN_SESSION/.test(r.error || '')) { D.list = null; stat('掃碼工作階段已失效，請回採買頁重新按 📷。', true); }
      else if (!D.list) stat('讀不到商品資料（' + ((r && r.error) || '網路') + '），請按「↻ 重新掃描」再試。', true);
      if (done) done(r);
    });
  }
  // 比對規則跟採購網站一樣：先比前 13 碼（JAN／_條碼對照），再比迪士尼 9 碼商品コード
  function normCode(v){
    var b=String(v==null?'':v).replace(/\s/g,'');
    if(/^\d+\.0$/.test(b)) b=b.slice(0,-2);
    if(!/^\d+$/.test(b)) return '';
    if(b.charAt(0)!=='0' && (b.length===12||b.length===25)) b='0'+b;
    return b;
  }
  function matchCode(raw){
    var b=normCode(raw), out=[], seen={}, L=D.list||[];
    if(!b) return { code:String(raw||'').trim(), list:out };
    function add(p){ if(!seen[p.key]){ seen[p.key]=1; out.push(p); } }
    var j=b.slice(0,13);
    L.forEach(function(p){ if(p.scanJan && p.scanJan===j) add(p); });
    if(!out.length){
      var c = b.length===9 ? b : ((b.length>=12 && b.charAt(0)==='0') ? b.substr(3,9) : '');
      if(c) L.forEach(function(p){ if(p.scanCode===c) add(p); });
    }
    if(!out.length) L.forEach(function(p){ var pj=normCode(p.jan); if(pj && (pj===b || (pj.length>=13 && pj.slice(0,13)===j))) add(p); });
    return { code:b, list:out };
  }
  function noData(txt){   // 還沒讀到商品資料：留在這頁說明（不跳走）
    if (!sid) { msg(''); showRes('<div class="bad">請從採買頁按 📷 開啟這一頁</div><div class="sub">掃到：'+esc(txt)+'</div>' + CONT); return; }
    msg(''); showRes('<div class="bad">還讀不到商品資料</div><div class="sub">掃到：'+esc(txt)+'。請稍等幾秒後按「↻ 繼續掃描」再掃一次。</div>' + CONT);
    if (!D.loading) loadData();
  }
  function hideRes(){ D.shown=null; $('res').classList.add('hidden'); $('res').innerHTML=''; $('box').classList.remove('small'); }
  function showRes(html){ $('res').innerHTML=html; $('res').classList.remove('hidden'); $('box').classList.add('small'); }
  var CONT = '<div class="row"><button class="btn" data-a="cont">↻ 繼續掃描</button></div>';
  function showOne(p, code){
    D.shown = { key:p.key, code:code };
    var done = (Number(p.remaining)||0) <= 0;
    showRes('<div class="top">' + (p.img ? '<img src="'+esc(p.img)+'" alt="" referrerpolicy="no-referrer" onerror="this.style.display=\'none\'">' : '')
      + '<div><div class="nm">'+esc(p.name)+'</div><div class="sub">'+esc(p.store)+(p.spec?'｜'+esc(p.spec):'')+(p.nameJp?'<br>'+esc(p.nameJp):'')+'</div></div></div>'
      + '<div class="nums"><div>訂購<b>'+fmt(p.ordered)+'</b></div><div>已買<b>'+fmt(p.bought)+'</b></div><div class="'+(done?'done':'rem')+'">剩餘<b>'+fmt(p.remaining)+'</b></div></div>'
      + (done ? '<div class="sub" style="margin-bottom:8px">✅ 這個已經買夠了</div>' : '')
      + '<div class="row"><button class="btn ghost" data-a="cont">↻ 繼續掃描</button><button class="btn" data-a="buy">📤 送到採買頁</button></div>'
      + '<div class="tip">條碼 '+esc(code)+'｜掃描只查詢，不會改任何數量。</div>');
  }
  function showFound(raw){
    var r = matchCode(raw);
    msg('');
    if (r.list.length === 1) return showOne(r.list[0], r.code);
    if (r.list.length > 1) {
      D.shown = null; D.pick = r;
      return showRes('<div class="nm">這個條碼對到 '+r.list.length+' 個商品，請選一個：</div>'
        + r.list.map(function(p,i){ return '<button class="pick" data-i="'+i+'">'+esc(p.name)+'<small>'+esc(p.store)+(p.spec?'｜'+esc(p.spec):'')+'｜訂購 '+fmt(p.ordered)+'・已買 '+fmt(p.bought)+'・剩餘 '+fmt(p.remaining)+'</small></button>'; }).join('')
        + CONT);
    }
    D.shown = null;
    showRes('<div class="bad">查無對應商品</div><div class="sub">條碼 '+esc(r.code)+'</div>'
      + '<div class="row"><button class="btn" data-a="cont">↻ 重新掃描</button><button class="btn ghost" data-a="manual">回採購頁手動搜尋</button></div>');
  }
  $('res').addEventListener('click', function(e){
    var b = e.target.closest('button'); if(!b) return;
    if (b.dataset.i != null && D.pick) { var p = D.pick.list[+b.dataset.i]; if(p) showOne(p, D.pick.code); return; }
    var a = b.dataset.a;
    if (a === 'cont') { hideRes(); resume(); }
    else if (a === 'buy' && D.shown) { var k=D.shown.key, p=(D.list||[]).filter(function(x){ return x.key===k; })[0]; if (p) sendToBuyPage(p, D.shown.code); }
    else if (a === 'manual' || a === 'close') { stop(); tryClose(function(){ msg('請切回原本的採買分頁（Safari 右下角的分頁按鈕）。'); }); }
  });
  function refreshShown(){
    if (D.list && Date.now() - D.at < 20000) return;
    loadData(function(){ if (D.shown && D.list) { var k=D.shown.key, c=D.shown.code, p=D.list.filter(function(x){ return x.key===k; })[0]; if(p && D.shown && D.shown.key===k) showOne(p, c); } });
  }

  // ---- 條碼程式（ZXing）----
  var ZX = ['https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js','https://unpkg.com/@zxing/library@0.21.3/umd/index.min.js'];
  function loadZX(){
    if (window.ZXing) return Promise.resolve(window.ZXing);
    var i=0;
    return new Promise(function(res,rej){ (function next(){
      if(i>=ZX.length){ rej(new Error('條碼程式載入失敗，請檢查網路')); return; }
      var s=document.createElement('script'); s.src=ZX[i++]; s.onload=function(){ window.ZXing?res(window.ZXing):next(); }; s.onerror=next; document.head.appendChild(s);
    })(); });
  }
  function core(Z){
    var h=new Map(), F=Z.BarcodeFormat;
    h.set(Z.DecodeHintType.POSSIBLE_FORMATS,[F.EAN_13,F.EAN_8,F.UPC_A,F.UPC_E,F.CODE_128,F.ITF,F.CODE_39]);
    h.set(Z.DecodeHintType.TRY_HARDER,true);
    var r=new Z.MultiFormatReader(); r.setHints(h); return r;
  }
  function dec(Z,r,c){
    try{ return r.decodeWithState(new Z.BinaryBitmap(new Z.HybridBinarizer(new Z.HTMLCanvasElementLuminanceSource(c)))).getText(); }
    catch(e){ return ''; } finally { try{ r.reset(); }catch(e){} }
  }
  function detector(){ try{ return window.BarcodeDetector ? new BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e','code_128','itf','code_39']}) : null; }catch(e){ return null; } }

  // ---- 即時相機 ----
  var S={ on:false, stream:null, timer:null, seq:0, done:false };
  function stop(){
    S.on=false; if(S.timer){ clearTimeout(S.timer); S.timer=null; }
    if(S.stream){ S.stream.getTracks().forEach(function(t){ t.stop(); }); S.stream=null; }
    var v=$('v'); try{ v.pause(); }catch(e){} v.srcObject=null;
  }
  function found(txt){
    if(S.done) return; S.done=true;
    if(navigator.vibrate) try{ navigator.vibrate(80); }catch(e){}
    S.last = txt; S.lastAt = Date.now();
    if (D.list) { S.paused = true; showFound(txt); refreshShown(); return; }   // 連續掃描：相機不關，直接顯示
    if (D.loading) {   // 商品資料還在讀：等一下再顯示，不要離開這頁
      S.paused = true; msg('掃到：' + txt + '，讀取商品資料中…');
      var w = setInterval(function(){ if (D.loading) return; clearInterval(w); if (D.list) showFound(txt); else noData(txt); }, 300);
      return;
    }
    S.paused = true; noData(txt);
  }
  function resume(){   // 相機一直開著，只是重新開始辨識 → 不會再問相機權限
    S.done=false; S.paused=false;
    if (S.on && S.stream) { msg('把條碼對準白框（可左右轉動手機）'); if (S.kick) S.kick(); }
    else start();
  }
  function start(){
    stop(); S.done=false; S.paused=false; $('box').classList.remove('hidden');
    if(!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia)){
      $('box').classList.add('hidden');
      msg(inApp() ? '這個 App 內建瀏覽器不能開相機，請改用 Safari／Chrome 開啟採購網站，或按「📸 拍照辨識」。' : '這個瀏覽器不能開相機，請按「📸 拍照辨識」或手動輸入。', true); return;
    }
    msg('開啟相機中…');
    var my=++S.seq;
    Promise.all([loadZX(), navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080}}})]).then(function(a){
      var Z=a[0], st=a[1], v=$('v');
      if(my!==S.seq){ st.getTracks().forEach(function(t){ t.stop(); }); return; }
      S.stream=st; S.on=true; v.setAttribute('playsinline',''); v.muted=true; v.srcObject=st;
      var p=v.play(); if(p&&p.catch) p.catch(function(){});
      if(!S.done) msg('把條碼對準白框（可左右轉動手機）');
      var r=core(Z), c=document.createElement('canvas'), x=c.getContext('2d',{willReadFrequently:true}), det=detector();
      S.kick = function(){ if(S.timer){ clearTimeout(S.timer); } S.timer=setTimeout(tick,300); };
      function tick(){
        if(!S.on||S.done||my!==S.seq) return;
